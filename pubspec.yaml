name: notes_marketplace
description: "A premium educational notes marketplace app built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  riverpod: ^2.4.10
  flutter_riverpod: ^2.4.10
  riverpod_generator: ^2.3.11

  # Networking & API
  dio: ^5.4.0

  # Firebase
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  firebase_storage: ^13.4.3
  firebase_messaging: ^16.4.3
  firebase_analytics: ^12.4.3

  # Authentication
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^8.1.0

  # Payments (needs CocoaPods)
  razorpay_flutter: ^1.3.7

  # PDF Viewer
  pdfx: ^2.5.0
  syncfusion_flutter_pdfviewer: ^33.2.13

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Encryption
  encrypt: ^5.0.1

  # Image Caching & Loading
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7

  # Navigation
  go_router: ^17.3.0
  
  # UI Components
  flutter_staggered_grid_view: ^0.7.0
  smooth_page_indicator: ^2.0.1
  lottie: ^3.5.1
  shimmer: ^3.0.0
  
  # Utilities
  intl: ^0.20.2
  uuid: ^4.0.0
  connectivity_plus: ^7.2.0
  device_info_plus: ^12.4.0
  package_info_plus: ^9.0.1
  
  # Logging
  logger: ^2.0.1
  
  # HTTP Client
  http: ^1.1.0
  flutter_local_notifications: ^22.0.1
  path_provider: ^2.1.6
  flutter_secure_storage: ^10.3.1
  share_plus: ^12.0.2
  flutter_widget_from_html: ^0.17.2
  flutter_quill: ^11.5.1
  flutter_svg: ^2.0.9
  pinput: ^6.0.2
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1
  google_mobile_ads: ^9.1.0
  firebase_crashlytics: ^5.2.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.3.11
  build_runner: ^2.4.6
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/notemartx_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-Regular.ttf
          weight: 400
    - family: Kalam
      fonts:
        - asset: assets/fonts/Kalam-Regular.ttf
          weight: 400
    - family: PatrickHand
      fonts:
        - asset: assets/fonts/PatrickHand-Regular.ttf
          weight: 400
    - family: GochiHand
      fonts:
        - asset: assets/fonts/GochiHand-Regular.ttf
          weight: 400
    - family: ShadowsIntoLight
      fonts:
        - asset: assets/fonts/ShadowsIntoLight-Regular.ttf
          weight: 400
    - family: ArchitectsDaughter
      fonts:
        - asset: assets/fonts/ArchitectsDaughter-Regular.ttf
          weight: 400
